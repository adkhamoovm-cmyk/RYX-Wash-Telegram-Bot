[project]
name = "ryx-wash-bot"
version = "0.1.0"
description = "Telegram bot for RYX Wash customer registration and wash orders"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.4,<4",
    "aiosqlite>=0.22.1",
    "apscheduler>=3.10,<4",
    "asyncpg>=0.29,<1",
    "psycopg[binary]>=3.1,<4",
    "pydantic-settings>=2.0,<3",
    "pytest>=9.1.1",
    "sqlalchemy>=2.0,<3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
